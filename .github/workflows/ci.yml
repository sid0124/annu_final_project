# VTR-Agent GitHub Actions CI/CD Pipeline

name: VTR-Agent CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run linting
      run: |
        python -m ruff check app/ tests/ --fix
        python -m mypy app/ --ignore-missing-imports

    - name: Run type checking
      run: |
        python -m mypy app/ --ignore-missing-imports

    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=app --cov-report=xml

    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v

    - name: Run security tests
      run: |
        python -m pytest tests/security/ -v

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      run: |
        pip install safety bandit
        safety check
        bandit -r app/ -f json -o bandit-report.json

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  docker-build:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t vtr-agent:latest .
        docker tag vtr-agent:latest domainforge/vtr-agent:latest

    - name: Push to Docker Hub
      run: |
        echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        docker push domainforge/vtr-agent:latest

  deploy:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        # Add your deployment commands here
        echo "Deploying to production..."

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
    - name: Quality gate check
      run: |
        echo "Running quality gate checks..."
        # Check if tests passed
        if [ ${{ needs.test.result }} != 'success' ]; then
          echo "Tests failed - quality gate blocked"
          exit 1
        fi
        echo "Quality gate passed"
