# VTR-Agent Package Configuration
# Build system for packaging and dependency management

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtr-agent"
version = "0.1.0"
description = "Verifiable Tool-Using Research Agent with Planning, Sandboxing and Safety Policies"
readme = "README.md"
authors = [
    {name = "DomainForge Team", email = "contact@domainforge.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: AI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "research", "agent", "safety", "security", "evidence", "verification"]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "transformers>=4.42",
    "datasets>=2.19",
    "accelerate>=0.30",
    "peft>=0.10",
    "trl>=0.8",
    "tokenizers>=0.19",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8; platform_system == 'Windows'",
    "faiss-cpu>=1.8; platform_system == 'Linux'",
    "mlflow>=2.11",
    "streamlit>=1.33",
    "opentelemetry-api>=1.24",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "docker>=7.0",
    "graphviz>=0.20",
    "networkx>=3.0",
    "cryptography>=41.0",
    "redis>=5.0",
    "asyncio",
    "pydantic-settings>=2.0",
    "typing-extensions>=4.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=0.30",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "safety>=2.3",
    "black>=23.0",
    "isort>=5.12",
]

[project.urls]
"Homepage" = "https://github.com/domainforge/vtr-agent"
"Documentation" = "https://github.com/domainforge/vtr-agent/wiki"
"Repository" = "https://github.com/domainforge/vtr-agent"
"Issues" = "https://github.com/domainforge/vtr-agent/issues"
"CI/CD" = "https://github.com/domainforge/vtr-agent/actions"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["vtr_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["E501", "B008"]
"docs/*" = ["E501"]
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
    "examples/",
]

[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = [".", "src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["vtr_agent/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
