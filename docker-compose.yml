version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////tmp/vtr_agent.db
      - JWT_SECRET_KEY=change-this-in-production
      - ENVIRONMENT=development
    volumes:
      - .:/app

frontend:
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////tmp/vtr_agent.db
    volumes:
      - .:/app